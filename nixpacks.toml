# Railway / Nixpacks build config
[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "python -m pip install -r server/requirements.txt"]

[start]
cmd = "uvicorn server.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"

[variables]
PYTHON_VERSION = "3.11"
